apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: dev-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-container
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
