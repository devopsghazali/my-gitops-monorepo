apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: dev-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-container
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
